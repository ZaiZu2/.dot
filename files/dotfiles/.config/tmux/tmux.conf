set-option -g default-shell "/bin/zsh"
set -g default-command "${SHELL} -i" # Open new shells as non-login
set-option -sa terminal-overrides ",*:Tc" # Support 256-bit colors
set -gq allow-passthrough on
set -g visual-activity off

set -g @plugin 'tmux-plugin/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
run ~/.config/tmux/plugins/tpm/tpm

unbind C-a
set -g prefix C-b
bind C-b send-prefix

# Add mouse support
set -g mouse on

bind = select-layout even-horizontal
bind + run-shell "$XDG_CONFIG_HOME/tmux/central_three_panes.sh"
bind C-f run-shell "$XDG_CONFIG_HOME/tmux/find_project.sh"
bind F run-shell "$XDG_CONFIG_HOME/tmux/new_project.sh"
bind S run-shell "$XDG_CONFIG_HOME/tmux/setup_sessions.sh"
bind C-c run-shell "$XDG_CONFIG_HOME/tmux/find_claude.sh"
# Q&A Claude popup: prefix C-q opens it (claude_qa.sh). Its session `_qa` (also
# named in claude_qa.sh, claude_sessions.sh, new_project.sh) has no prefix and
# uses the key table `qa` instead of root, so no other binding works inside the
# popup: C-b C-q closes it, C-b C-b sends C-b, every other key goes to Claude.
bind C-q run-shell "$XDG_CONFIG_HOME/tmux/claude_qa.sh"
bind -T qa C-b switch-client -T qa-prefix
bind -T qa-prefix C-q detach-client
bind -T qa-prefix C-b send-keys C-b
# Claude pins: F1..F4 jump to the pinned Claude, prefix F1..F4 pin the current
# pane's Claude. F-keys need no Alt/Cmd, so they work alike on every OS.
bind -n F1 run-shell "$XDG_CONFIG_HOME/tmux/claude_pins.sh jump 1"
bind -n F2 run-shell "$XDG_CONFIG_HOME/tmux/claude_pins.sh jump 2"
bind -n F3 run-shell "$XDG_CONFIG_HOME/tmux/claude_pins.sh jump 3"
bind -n F4 run-shell "$XDG_CONFIG_HOME/tmux/claude_pins.sh jump 4"
bind F1 run-shell "$XDG_CONFIG_HOME/tmux/claude_pins.sh pin 1 #{pane_id}"
bind F2 run-shell "$XDG_CONFIG_HOME/tmux/claude_pins.sh pin 2 #{pane_id}"
bind F3 run-shell "$XDG_CONFIG_HOME/tmux/claude_pins.sh pin 3 #{pane_id}"
bind F4 run-shell "$XDG_CONFIG_HOME/tmux/claude_pins.sh pin 4 #{pane_id}"
bind C-d run-shell "$XDG_CONFIG_HOME/tmux/cd_all_panes.sh --popup"
set-hook -g session-created "run-shell '$XDG_CONFIG_HOME/tmux/setup_sessions.sh --once \"#{hook_session_name}\"'"

bind C-l send-keys 'C-l'
bind -n C-Left previous-window
bind -n C-Right next-window
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Set vi-mode
set-window-option -g mode-keys vi

# Yank keybindings
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle -x
bind-key -T copy-mode-vi y send-keys -X copy-selection-no-clear

# Jump scroll 1000 lines in copy mode
bind-key -T copy-mode-vi C-E send-keys -X -N 1000 scroll-up
bind-key -T copy-mode-vi C-f send-keys -X -N 1000 scroll-down

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_current_number_color "yellow"
set -g @catppuccin_pane_active_border_color "#C8C093" # Doesn't work?
set -g status-bg "#1f1f28"
# Popups in kanagawa instead of catppuccin's base color
set -g popup-style "bg=#1f1f28,fg=#dcd7ba"
set -g popup-border-style "fg=#C8C093"
set -g popup-border-lines "heavy"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

set-option -g pane-border-lines "heavy"
set-option -g pane-active-border-style 'fg=#C8C093'
